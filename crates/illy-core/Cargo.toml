[package]
name = "illy-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
insecure-plain = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"
rustls-platform-verifier = "0.7"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls", "ring", "rustls-platform-verifier", "builder", "hostname"] }
mail-parser = { version = "1.0", features = ["full_encoding"] }
ammonia = "4"
rusqlite = { version = "0.42", features = ["bundled"] }
utf7-imap = "0.3"
imap-proto = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
futures = "0.3"
base64 = "0.22"
regex = "1"
html-escape = "0.2"
socket2 = "0.6"
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
