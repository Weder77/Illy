name: Publier une version

# Bouton « Run workflow » (onglet Actions) : crée le tag v<version de tauri.conf.json> sur la branche
# choisie, puis lance le workflow Release sur ce tag (seul un tag v* accède aux secrets de PRD).
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Créer le tag et lancer la release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer le tag
        id: tag
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Le tag $tag existe déjà : change la version (node scripts/bump-version.mjs x.y.z) avant de publier."
            exit 1
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Un tag poussé avec le jeton de la CI ne déclenche pas d'autre workflow : on lance Release nous-mêmes.
      - name: Lancer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY"
